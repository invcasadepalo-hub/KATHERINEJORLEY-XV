<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galería ovalada</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: transparent; }
.galeria {
  width: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 15px;
}
.marco-ovalado {
  position: relative;
  width: min(75vw, 300px);
  aspect-ratio: 3 / 4;
  overflow: hidden;
  border-radius: 50%;
  border: 4px solid #cfb36f;
  box-shadow: 0 0 0 3px rgba(207,179,111,.25),
              0 8px 24px rgba(0,0,0,.18);
}
.marco-ovalado img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  opacity: 0;
  transition: opacity .8s ease-in-out;
}
.marco-ovalado img.activa { opacity: 1; }
@media (min-width: 600px) {
  .marco-ovalado { width: 260px; }
}
</style>
</head>
<body>
<div class="galeria">
  <div class="marco-ovalado">
    <img src="foto1.jpg" class="activa" alt="Fotografía 1">
    <img src="foto2.jpg" alt="Fotografía 2">
    <img src="foto3.jpg" alt="Fotografía 3">
    <img src="foto4.jpg" alt="Fotografía 4">
  </div>
</div>
<script>
const fotos = document.querySelectorAll(".marco-ovalado img");
let indice = 0;
setInterval(() => {
  fotos[indice].classList.remove("activa");
  indice = (indice + 1) % fotos.length;
  fotos[indice].classList.add("activa");
}, 2000);
</script>
</body>
</html>
