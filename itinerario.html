
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Itinerario XV</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root {
  --vino: #7C021B;
  --oro: #CFB36F;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  background: transparent;
}

.itinerario {
  width: 100%;
  max-width: 540px;
  margin: 0 auto;
  padding: 22px 12px 25px;
  color: var(--oro);
  font-family: 'Cormorant', Georgia, serif;
}

.titulo {
  text-align: center;
  font-size: 30px;
  font-weight: 500;
  letter-spacing: 6px;
  margin: 0 0 30px;
  color: var(--oro);
}

.lista {
  position: relative;
  width: 100%;
}

/* Línea central */
.linea {
  position: absolute;
  left: 50%;
  top: 45px;
  bottom: 45px;
  width: 1px;
  background: var(--oro);
  transform: translateX(-50%);
  opacity: .9;
}

/* Corazón que recorre la línea */
.corazon {
  position: absolute;
  z-index: 5;
  left: 50%;
  top: 0;
  width: 30px;
  height: 30px;
  transform: translate(-50%, -50%);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: top 3s ease-in-out;
  filter: drop-shadow(0 0 4px rgba(207,179,111,.4));
  pointer-events: none;
}

/* Cada horario */
.evento {
  position: relative;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 30px minmax(0, 1fr);
  align-items: center;
  min-height: 130px;
  width: 100%;
}

/* Iconos originales a la izquierda */
.icono {
  grid-column: 1;
  justify-self: center;
  width: 100%;
  max-width: 145px;
  height: 108px;
  object-fit: contain;
  object-position: center;
}

/* Punto sobre la línea */
.marca {
  grid-column: 2;
  justify-self: center;
  width: 8px;
  height: 8px;
  border: 1px solid var(--oro);
  border-radius: 50%;
  background: var(--vino);
  z-index: 2;
}

/* Horarios a la derecha */
.detalle {
  grid-column: 3;
  padding-left: 15px;
  text-align: left;
  min-width: 0;
}

.hora {
  font-size: 25px;
  line-height: 1.1;
  letter-spacing: 2px;
  font-weight: 500;
  color: var(--oro);
}

.nombre {
  font-size: 16px;
  line-height: 1.3;
  letter-spacing: 2px;
  margin-top: 6px;
  color: var(--oro);
}

@media (max-width: 400px) {
  .itinerario {
    padding-left: 5px;
    padding-right: 5px;
  }

  .titulo {
    font-size: 26px;
    letter-spacing: 4px;
  }

  .evento {
    grid-template-columns: minmax(0, 1fr) 26px minmax(0, 1fr);
    min-height: 112px;
  }

  .icono {
    max-width: 112px;
    height: 88px;
  }

  .hora {
    font-size: 21px;
    letter-spacing: 1.5px;
  }

  .nombre {
    font-size: 14px;
    letter-spacing: 1.2px;
  }

  .detalle {
    padding-left: 10px;
  }
}
</style>
</head>

<body>
<section class="itinerario">
  <h1 class="titulo">ITINERARIO</h1>

  <div class="lista" id="lista">
    <div class="linea"></div>

    <div class="corazon" id="corazon" aria-hidden="true">
      <svg viewBox="0 0 32 32" width="29" height="29"
           xmlns="http://www.w3.org/2000/svg">
        <path d="M16 27S3 19 3 10C3 3 12 2 16 9C20 2 29 3 29 10C29 19 16 27 16 27Z"
              fill="#7C021B"
              stroke="#CFB36F"
              stroke-width="1.5"/>
      </svg>
    </div>

    <div class="evento">
      <img class="icono" src="icono_iglesia.png" alt="Iglesia">
      <span class="marca"></span>
      <div class="detalle">
        <div class="hora">6:00 PM</div>
        <div class="nombre">CEREMONIA</div>
      </div>
    </div>

    <div class="evento">
      <img class="icono" src="icono_arco.png" alt="Arco floral">
      <span class="marca"></span>
      <div class="detalle">
        <div class="hora">7:00 PM</div>
        <div class="nombre">RECEPCIÓN</div>
      </div>
    </div>

    <div class="evento">
      <img class="icono" src="icono_banquete.png" alt="Banquete">
      <span class="marca"></span>
      <div class="detalle">
        <div class="hora">8:30 PM</div>
        <div class="nombre">BANQUETE</div>
      </div>
    </div>

    <div class="evento">
      <img class="icono" src="icono_quinceanera.png" alt="Quinceañera">
      <span class="marca"></span>
      <div class="detalle">
        <div class="hora">9:30 PM</div>
        <div class="nombre">VALS</div>
      </div>
    </div>

    <div class="evento">
      <img class="icono" src="icono_pastel.png" alt="Pastel">
      <span class="marca"></span>
      <div class="detalle">
        <div class="hora">1:00 AM</div>
        <div class="nombre">FIN DEL EVENTO</div>
      </div>
    </div>

  </div>
</section>

<script>
(function () {
  const lista = document.getElementById('lista');
  const corazon = document.getElementById('corazon');
  const eventos = Array.from(lista.querySelectorAll('.evento'));
  let indice = 0;
  let iniciado = false;

  function moverCorazon() {
    const rectLista = lista.getBoundingClientRect();
    const rectEvento = eventos[indice].getBoundingClientRect();

    const centro =
      rectEvento.top - rectLista.top + rectEvento.height / 2;

    corazon.style.top = centro + 'px';
  }

  function iniciar() {
    if (iniciado) return;
    iniciado = true;

    moverCorazon();

    setTimeout(function () {
      corazon.style.transition = 'top 3s ease-in-out';

      setInterval(function () {
        indice = (indice + 1) % eventos.length;
        moverCorazon();
      }, 3000);
    }, 100);
  }

  window.addEventListener('load', iniciar);
  window.addEventListener('resize', moverCorazon);

  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () {
      if (iniciado) moverCorazon();
    });
  }

  iniciar();
})();
</script>
</body>
</html>
