<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Itinerario XV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--vino:#7C021B;--oro:#CFB36F}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:transparent}
.itinerario{width:100%;max-width:560px;margin:0 auto;padding:18px 10px 22px;color:var(--oro);font-family:'Cormorant',Georgia,serif}
.titulo{text-align:center;color:var(--oro);font-size:29px;font-weight:500;letter-spacing:6px;margin:0 0 24px}
.lista{position:relative}
.linea{position:absolute;left:42%;top:35px;bottom:35px;width:1px;background:var(--oro);opacity:.9}
.corazon{position:absolute;z-index:3;left:42%;top:0;width:27px;height:27px;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;transition:top 3s ease-in-out;filter:drop-shadow(0 0 3px rgba(207,179,111,.35));pointer-events:none}
.evento{position:relative;display:grid;grid-template-columns:37% 10% 53%;align-items:center;min-height:128px}
.icono{grid-column:1;width:100%;max-width:125px;max-height:105px;height:auto;object-fit:contain;justify-self:center}
.marca{grid-column:2;justify-self:center;width:8px;height:8px;border:1px solid var(--oro);border-radius:50%;background:var(--vino);z-index:1}
.detalle{grid-column:3;padding-left:13px;text-align:left}
.hora{font-size:25px;line-height:1.05;letter-spacing:3px;font-weight:500}
.nombre{font-size:16px;line-height:1.25;letter-spacing:2.5px;margin-top:6px}
@media(max-width:380px){.titulo{font-size:25px;letter-spacing:4px}.evento{min-height:112px;grid-template-columns:34% 10% 56%}.icono{max-width:100px;max-height:88px}.hora{font-size:21px;letter-spacing:2px}.nombre{font-size:14px;letter-spacing:1.8px}.linea,.corazon{left:39%}}
</style>
</head>
<body>
<section class="itinerario">
<h1 class="titulo">ITINERARIO</h1>
<div class="lista" id="lista">
<div class="linea"></div>
<div class="corazon" id="corazon" aria-hidden="true">
<svg viewBox="0 0 32 32" width="27" height="27" xmlns="http://www.w3.org/2000/svg">
<path d="M16 27S3 19 3 10C3 3 12 2 16 9C20 2 29 3 29 10C29 19 16 27 16 27Z" fill="#7C021B" stroke="#CFB36F" stroke-width="1.5"/>
</svg>
</div>
<div class="evento"><img class="icono" src="icono_iglesia.png" alt="Iglesia"><span class="marca"></span><div class="detalle"><div class="hora">6:00 PM</div><div class="nombre">CEREMONIA</div></div></div>
<div class="evento"><img class="icono" src="icono_arco.png" alt="Arco floral"><span class="marca"></span><div class="detalle"><div class="hora">7:00 PM</div><div class="nombre">RECEPCIÓN</div></div></div>
<div class="evento"><img class="icono" src="icono_banquete.png" alt="Banquete"><span class="marca"></span><div class="detalle"><div class="hora">8:30 PM</div><div class="nombre">BANQUETE</div></div></div>
<div class="evento"><img class="icono" src="icono_quinceanera.png" alt="Vals de quinceañera"><span class="marca"></span><div class="detalle"><div class="hora">9:30 PM</div><div class="nombre">VALS</div></div></div>
<div class="evento"><img class="icono" src="icono_pastel.png" alt="Pastel"><span class="marca"></span><div class="detalle"><div class="hora">1:00 AM</div><div class="nombre">FIN DEL EVENTO</div></div></div>
</div>
</section>
<script>
(function(){
 const lista=document.getElementById('lista'), corazon=document.getElementById('corazon');
 const eventos=[...lista.querySelectorAll('.evento')];let indice=0;
 function mover(){const a=lista.getBoundingClientRect(),b=eventos[indice].getBoundingClientRect();corazon.style.top=(b.top-a.top+b.height/2)+'px'}
 function iniciar(){corazon.style.transition='none';mover();requestAnimationFrame(()=>requestAnimationFrame(()=>{corazon.style.transition='top 3s ease-in-out';setInterval(()=>{indice=(indice+1)%eventos.length;mover()},3000)}))}
 window.addEventListener('load',iniciar);window.addEventListener('resize',mover);
 if(document.fonts&&document.fonts.ready)document.fonts.ready.then(mover);
})();
</script>
</body>
</html>
